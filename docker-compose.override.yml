version: '3.8'

services:
  app:
    image: nginx:alpine
    command: >
      sh -c "
      echo 'server {
        listen 8080;
        location / {
          return 200 \"Caddy работает! App на порту 8080\n\";
          add_header Content-Type text/plain;
        }
      }' > /etc/nginx/conf.d/default.conf &&
      nginx -g 'daemon off;'
      "

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - app
